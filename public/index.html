<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

    border:2px solid rgba(0,0,0,0.25); box-shadow:0 2px 6px rgba(0,0,0,0.4); pointer-events:none; }
  #chat { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); width:min(92vw,440px); z-index:20; font:13px/1.4 system-ui,sans-serif; }
  #chatLog { color:#fff; background:rgba(0,0,0,0.4); border-radius:8px; padding:4px 10px; margin-bottom:6px; max-height:96px; overflow:hidden; display:none; }
  #chatIn { width:100%; box-sizing:border-box; padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.5); background:rgba(0,0,0,0.55); color:#fff; font-size:16px; outline:none; }
  #chatIn:focus { border-color:#ffd76b; }

</head>
<body>
<div id="hud"><div><b>AI Character World</b> &middot; AI: <span id="aiState">idle</span> &middot; Brain: <span id="brainState">starting</span></div>
  <div>Last from AI: <span id="brainLast">nothing yet</span></div>
  <div>Look sensitivity <input type="range" id="sens" min="0.3" max="3" step="0.05" value="1"></div></div>
<div id="hint2">WASD / joystick to walk &middot; drag or mouse to look &middot; type below to talk to him</div>
<div id="chat"><div id="chatLog"></div><input id="chatIn" placeholder="Say something..." autocomplete="off" maxlength="300"></div>
<div id="joyZone"><div id="joyBase"></div><div id="joyStick"></div></div>
<div id="lookZone"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   AI CHARACTER WORLD — a base world + a character an AI will drive.
   Factories (each one self-contained):
     WorldFactory     ground, sky, fog, lights        (from Cover Drive)
     JoystickFactory  WASD + touch joystick input     (from Cover Drive)
     CameraFactory    first-person look + sensitivity (from Cover Drive)
     RigFactory       the character in the 3D world   (bridge for the Catch Factory rig)
     AIPlayerFactory  action executor (the server brain tells it what to do)
     SayFactory       text bubble above his head
     BrainFactory     WebSocket link to the server brain + the chat box

   ===================================================================== */

const CONFIG = { tilt: 0.12, zoom: 1 };   // the rig's draw() reads these two (low tilt = seen almost side-on, like a person standing in the world)

/* ---------- Catch Factory 138: HumanMotion (clips: idle / walk / run) ---------- */

const BatFactory = { M: null, _al: 0, spec: { stanceSpread: 0 }, has: () => false, blend: () => 0, clip: c => c, hand: () => null, begin(){}, got: () => false, render(){} };

/* =====================================================================
   CAMERA FACTORY — first person: walk + look, with a sensitivity multiplier (Cover Drive)
   ===================================================================== */
const CameraFactory = {
  EYE_HEIGHT: 1.7, WALK_SPEED: 17, ROAM_RADIUS: 105,
  SENS_MOUSE: 0.0024, SENS_TOUCH: 0.0032, sens: 1,   // sens = the slider multiplier on both

  init(scene, dom){

    const slider = document.getElementById('sens'); slider.addEventListener('input', () => { self.sens = parseFloat(slider.value); });

    dom.addEventListener('pointerdown', e => { if (document.pointerLockElement === dom) return; dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('pointerup', () => dragging = false);
    window.addEventListener('pointermove', e => {
      if (!dragging || document.pointerLockElement === dom) return;
      self.yaw -= (e.clientX - lx) * self.SENS_MOUSE * 2.5 * self.sens; self.pitch -= (e.clientY - ly) * self.SENS_MOUSE * 2.5 * self.sens; clampP(); lx = e.clientX; ly = e.clientY;
    });

    if (!isTouch) zone.style.display = 'none';
    zone.addEventListener('pointerdown', e => { act = true; id = e.pointerId; tx = e.clientX; ty = e.clientY; zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointermove', e => {

  update(dt){

    fwd -= J.y; strafe += J.x;

/* =====================================================================

/* =====================================================================
   AI PLAYER FACTORY — the body's action executor. It has NO will of its own: the brain (server) sends actions, it plays them in order.
   Actions: {do:'walk'|'run', x, z} {do:'come'} {do:'face'} {do:'wait', s} {do:'emote', mood} {do:'stop'}   (each one finishes before the next starts)
   ===================================================================== */

  x: 0, z: 0, hop: 0, hist: [], heading: 0, clip: 'idle', mood: 'neutral', turnRate: 5, roam: 58, queue: [], cur: null,
  do(list){ for (const a of list || []) this.queue.push(a); },
  clear(){ this.queue.length = 0; this.cur = null; },
  busy(){ return !!this.cur || this.queue.length > 0; },
  lbl(t){ if (t !== this._l){ this._l = t; (this._e = this._e || document.getElementById('aiState')).textContent = t; } },   // DOM text only when it changes
  begin(a){

    if (a.do === 'spin'){ const d = Math.max(-720, Math.min(720, +a.deg || 360)); this.cur = { t: 'spin', rem: Math.abs(d) * Math.PI / 180, sg: d < 0 ? -1 : 1, left: 9 }; }
    else if (a.do === 'jump') this.cur = { t: 'jump', left: 0.7, T: 0.7 };
    else if (a.do === 'punch' || a.do === 'heavy' || a.do === 'shoot'){ const cost = { punch: 8, heavy: 18, shoot: 5 }[a.do]; if (this.sta !== undefined){ if (this.sta < cost){ this.cur = { t: 'wait', left: 0.4 }; return; } this.sta -= cost; } this.cur = a.do === 'punch' ? { t: 'punch', left: 0.4, hit: false } : a.do === 'heavy' ? { t: 'heavy', left: 0.9, hit: false } : { t: 'shoot', left: 0.4, fired: false }; }
    else if (a.do === 'dodge'){ FightFactory.dodge(this); this.cur = { t: 'wait', left: 0.3 }; }
    else if (a.do === 'block') this.cur = { t: 'block', left: Math.min(2, +a.s || 1.2) };
    else if (a.do === 'move'){ const nm = 'ai_' + String(a.name || 'move'); HumanMotion.clips[nm] = Object.assign({}, HumanMotion.clips.idle, a.p || {}); this.cur = { t: 'clip', name: nm, left: Math.min(10, +a.s || 3) }; }   // any body motion the AI invents = a clip of motion numbers
    else if (a.do === 'walk' || a.do === 'run'){ const r = Math.hypot(a.x, a.z), k = r > this.roam ? this.roam / r : 1; this.cur = { t: a.do, x: a.x * k, z: a.z * k, left: 25 }; }

    else if (a.do === 'wait') this.cur = { t: 'wait', left: Math.min(10, +a.s || 1) };

  turn(want, dt){ let d = Math.atan2(Math.sin(want - this.heading), Math.cos(want - this.heading)); const s = Math.max(-this.turnRate * dt, Math.min(this.turnRate * dt, d)); this.heading += s; return Math.abs(d - s); },
  update(dt){

    if (this.dash && this.dash.t > 0){ this.x += this.dash.vx * dt; this.z += this.dash.vz * dt; this.dash.t -= dt; this.dashing = true; } else this.dashing = false;   // side-step / back-step / knock-back
    if (this.ko){ this.clip = 'ai_ko'; this.cur = null; this.queue.length = 0; return; }

/* =====================================================================

    for (const b of this.bl){ if (!b.on) continue; b.x += b.vx * dt; b.z += b.vz * dt; b.life -= dt; b.m.position.set(b.x, 1.15, b.z);
      const f = b.own === A ? B : A, near = this.on && !f.ko && Math.hypot(f.x - b.x, f.z - b.z) < 0.75;
      if (near && f.inv > 0 && !b.dodged){ b.dodged = true; b.own.seen.dodge++; this.note(f, 'you dodged a bullet'); this.note(b.own, 'he dodged your bullet'); }
      else if (near && f.inv <= 0){ this.dmg(b.own, f, 10, 'bullet'); b.life = 0; }
      if (b.life <= 0){ b.on = false; b.m.visible = false; } }
    if (!this.on) return; this.T += dt; this.quiet = (this.quiet || 0) + dt;
    { const dx = B.x - A.x, dz = B.z - A.z, dd = Math.hypot(dx, dz); if (dd < 0.8 && dd > 0.001){ const pu = (0.8 - dd) / 2; A.x -= dx / dd * pu; A.z -= dz / dd * pu; B.x += dx / dd * pu; B.z += dz / dd * pu; } }   // they cannot stand inside each other
    [A, B].forEach((f, i) => {
      const o = i ? A : B, d = Math.hypot(o.x - f.x, o.z - f.z), act = f.cur && f.cur.t;
      if (!f.ko && f.stun <= 0 && (!f.cur || act === 'punch' || act === 'heavy' || act === 'block' || act === 'wait' || act === 'shoot')) f.turn(Math.atan2(o.x - f.x, o.z - f.z), dt);   // keeps facing the foe
      if (act === 'block'){ f.sta -= 10 * dt; if (f.sta <= 0){ f.sta = 0; f.cur = null; f.stun = 0.4; } } else if (!act || act === 'wait') f.sta = Math.min(100, f.sta + 18 * dt); else if (act === 'walk') f.sta = Math.min(100, f.sta + 10 * dt);   // blocking drains stamina, resting restores it
      // reactions have a delay (personality): a fast fighter can see a jab coming, a slow one only the telegraphed heavy swing
      let thr = o.cur && (o.cur.t === 'punch' || o.cur.t === 'heavy') && !o.cur.seen && d < 2.6 ? o.cur : null;
      if (!thr) for (const b of this.bl) if (b.on && b.own === o && !b.seen && Math.hypot(f.x - b.x, f.z - b.z) < 9 && (f.x - b.x) * b.vx + (f.z - b.z) * b.vz > 0 && Math.abs((f.x - b.x) * b.vz - (f.z - b.z) * b.vx) / 14 < 1) thr = b;
      if (thr && !f.pr && !f.stun && !f.ko){ thr.seen = true; f.pr = { t: f.pers.react * (0.8 + Math.random() * 0.5), k: thr.t === 'heavy' ? 'heavy' : thr.t === 'punch' ? 'light' : 'bullet', thr }; }
      if (f.pr && (f.pr.t -= dt) <= 0){
        const k = f.pr.k, thr2 = f.pr.thr; f.pr = null; const live = k === 'bullet' ? thr2.on : (o.cur && o.cur === thr2 && !thr2.hit), skill = (0.4 + 0.55 * f.tac.dodge) * (f.sta > 15 ? 1 : 0.4) * (f.hp < 30 ? 1.15 : 1);
        if (live && !f.stun && Math.random() < skill){ const pd = k === 'heavy' ? 0.8 : k === 'bullet' ? 0.85 : 0.4; if (f.dcd <= 0 && f.sta >= 15 && Math.random() < pd){ if (k === 'heavy' && thr2.left > 0.3) f.dl = { t: thr2.left - 0.3 }; else if (k === 'bullet') f.dl = { t: Math.max(0, (Math.hypot(f.x - thr2.x, f.z - thr2.z) - 2.5) / 14) }; else this.dodge(f); } else if (!(f.cur && f.cur.t === 'block')) f.cur = { t: 'block', left: 0.7 }; }

      if (!f.cur && !f.queue.length && !f.ko) this.brain(f, o, d, dt);
      this.tk[i] -= dt;
      if (this.tk[i] <= 0 && (!this.pend[i] || Date.now() - this.pend[i] > 8000) && ws && ws.readyState === 1 && !document.hidden){ this.tk[i] = 2.4 + i * 0.3; this.pend[i] = Date.now(); ws.send(JSON.stringify({ type: 'fight', fid: i, state: this.st(i) })); }   // the AI re-plans every ~2.4 s (staggered, so they don't move in lockstep)
    });
  }
};
const PerfFactory = {   // just measures (no resolution changes): fps and how long the two rigs take to draw
  t0: performance.now(), n: 0, d: 0,
  init(){ this.el = document.createElement('div'); this.el.style.cssText = 'position:fixed;right:6px;bottom:60px;font:11px monospace;color:#fff;background:rgba(0,0,0,.45);padding:2px 5px;border-radius:4px;z-index:9;pointer-events:none'; document.body.appendChild(this.el); },
  tick(){ this.n++; const now = performance.now(); if (now - this.t0 < 1000) return; this.el.textContent = Math.round(this.n * 1000 / (now - this.t0)) + ' fps · rigs ' + (this.d / this.n).toFixed(1) + ' ms'; this.n = 0; this.d = 0; this.t0 = now; }

/* ---------- start ---------- */
WorldFactory.init();
JoystickFactory.init();
CameraFactory.init(WorldFactory.scene, WorldFactory.renderer.domElement);
RigFactory.init(WorldFactory.scene);
FightFactory.init(WorldFactory.scene);
PerfFactory.init();
SayFactory.init(WorldFactory.scene);
BrainFactory.init();
setTimeout(() => { const h = document.getElementById('hint2'); if (h) h.style.opacity = 0; }, 8000);
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  CameraFactory.update(dt);
  BrainFactory.update(dt);
  const sdt = FightFactory.hs > 0 ? dt * 0.12 : dt; FightFactory.hs = Math.max(0, FightFactory.hs - dt);   // hit-stop: a tiny freeze on impact
  AIPlayerFactory.update(sdt);
  const _t = performance.now();
  RigFactory.update(sdt, AIPlayerFactory, CameraFactory.camera);
  FightFactory.update(sdt);
  AIPlayerFactory2.update(sdt); RigFactory2.update(sdt, AIPlayerFactory2, CameraFactory.camera);
  PerfFactory.d += performance.now() - _t; PerfFactory.tick();
  SayFactory.update(AIPlayerFactory, dt);
  WorldFactory.renderer.render(WorldFactory.scene, CameraFactory.camera);
}
animate();
</script>
